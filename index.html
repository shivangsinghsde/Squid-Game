<!doctype html>
<html class="m-0 p-0 box-border h-full w-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-full w-full">
    <main
      class="h-full w-full pt-4 pl-7 pr-7 pb-4 bg-linear-to-tr from-rose-950 via-pink-900 via-pink-800 to-violet-950"
    >
      <nav class="bg-transparent-800 w-full h-15 flex items-center justify-between">
        <img
          src="https://pngimg.com/uploads/squid_game/squid_game_PNG35.png "
          alt=""
          class="h-13"
        />
        <div class="h-13 w-200 bg-transparent-800 flex items-center justify-evenly text-white">
          <h6 class="text-xl">About</h6>
          <h6 class="text-xl">Watch now</h6>
          <h6 class="text-xl">Actors</h6>
          <h6 class="text-xl">Contact</h6>
        </div>
        <span><i class="ri-menu-3-line text-2xl text-white"></i></span>
      </nav>

      <section class="w-full h-110 bg--500 mt-3 flex justify-between">
        <div class="h-full pl-10 bg-transparent-500 w-1/3 flex flex-col gap-5">
            <img src="https://pngimg.com/uploads/squid_game/squid_game_PNG35.png" alt="" class="w-90 mt-8">
            <p class="text-md text-white">Action / Thriller / Drama Series directed by Dong-hyuk Hwang <br>Season 1: 9 Episodes</p>
            <div class="w-full h-20 bg-transparent-500 flex gap-10">
                <button class="h-12 w-1/3 bg-linear-to-r from-pink-700 to-orange-400 border-black border-2 border-solid border-rose-950 rounded-lg text-white flex items-center justify-center gap-1 text-md"><i class="ri-play-circle-fill text-xl"></i>Play Now</button>
                <button class="h-12 w-1/3 bg-transperent border-pink border-2 border-solid border-rose-950 rounded-lg text-white flex items-center justify-center gap-1 text-md"><i class="ri-play-line text-md "></i>Watch Trailer</button>
            </div>
        </div>
        <div class="h-full bg-cyan-500 w-1/2">
            <img src="" alt="">
        </div>
      </section>


    </main>
  </body>
</html>
